services:
  api:
    build: .
    image: engrow-api:latest
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env — inside the container the
      # SQLite file must live on the mounted volume below, not the ephemeral image layer.
      DATABASE_URL: sqlite:////app/data/engrow.db
    volumes:
      # SQLite database file — persisted on the host, survives container recreation.
      - db_data:/app/data
      # Must exist on the host before `docker compose up` — generate with
      # scripts/generate_vapid_keys.py. A missing file becomes an empty directory here.
      - ./vapid_private_key.pem:/app/vapid_private_key.pem:ro
      - backups:/app/backups

volumes:
  db_data:
  backups:
